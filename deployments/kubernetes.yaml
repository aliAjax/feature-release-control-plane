apiVersion: v1
kind: ConfigMap
metadata: {name: controlplane-config}
data: {CONTROLPLANE_HTTP_ADDRESS: ":8080", CONTROLPLANE_LOG_LEVEL: "info"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: feature-release-control-plane}
spec:
  replicas: 2
  selector: {matchLabels: {app: feature-release-control-plane}}
  template:
    metadata: {labels: {app: feature-release-control-plane}}
    spec:
      containers:
      - name: api
        image: feature-release-control-plane:latest
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: controlplane-config}}]
        env: [{name: CONTROLPLANE_SNAPSHOT_SECRET, valueFrom: {secretKeyRef: {name: controlplane-secrets, key: snapshot-secret}}}]
        readinessProbe: {httpGet: {path: /readyz, port: 8080}}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: feature-release-control-plane}
spec: {selector: {app: feature-release-control-plane}, ports: [{port: 80, targetPort: 8080}]}
